# Render context schema for meta.yaml.j2 (stage-2 str.format substitution map)
$schema: https://json-schema.org/draft/2020-12/schema
title: meta.yaml.j2 render context
type: object
required:
  - name
  - version
  - sha256
  - import_name
  - summary
properties:
  name:
    type: string
    minLength: 1
    description: PyPI package name; also drives the source URL path.
  version:
    type: string
    minLength: 1
  sha256:
    type: string
    pattern: '^[0-9a-f]{64}$'
  noarch:
    type: string
    description: >-
      Either a leading-newline + indented "noarch: python" line (becomes the next line
      under build:) or the empty string.
  skip:
    type: string
    description: 'Selector suffix for the build script line, e.g. "  # [win]", or empty string.'
  build_deps:
    type: string
    description: Pre-rendered YAML lines for extra host requirements, or empty string.
  run_deps:
    type: string
    description: Pre-rendered YAML lines for extra run requirements, or empty string.
  import_name:
    type: string
    minLength: 1
    description: Module name used in the test imports block; usually name with - replaced by _.
  home_url:
    type: string
  license_id:
    type: string
  license_family:
    type: string
  license_file:
    type: string
  summary:
    type: string
    minLength: 1
  description:
    type: string
  dev_url:
    type: string
  doc_url:
    type: string
  zendesk_ticket:
    type: [string, integer]
additionalProperties: false
