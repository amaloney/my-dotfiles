[project]
name = "metadata-observer"
version = "0.1.0"
description = "Package metadata acquisition (PyPI, conda, GitHub)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metadata_observer"]

# pixi
[tool.pixi.workspace]
channels = ["https://repo.anaconda.com/pkgs/main", "conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
requests = ">=2.32,<3"
pytest = ">=8.4,<10"
pytest-cov = ">=6,<8"
ruff = ">=0.12,<0.16"

[tool.pixi.pypi-dependencies]
metadata-observer = { path = ".", editable = true }

# dev: code-index generation + semantic search. Preferred env for development
# work; not default — plain `pixi run` uses the lightweight default env.
[tool.pixi.feature.dev.pypi-dependencies]
chromadb = ">=0.5,<2"

[tool.pixi.feature.dev.tasks]
# Scripts must run from the installed copy — they resolve db/project paths relative to their own location
index-install = "../.config/harnesses/skills/code-index/scripts/install.sh ."
index-build = "python .harness/code_index/build_index_temporal.py ."
index-query = "python .harness/code_index/query_temporal.py search"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "python -m pytest tests/ -v"
lint = "ruff check src/ tests/"

# ruff
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "ASYNC", "S"]
fixable = ["E", "F", "I"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["metadata_observer"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310"]

# pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "network: marks tests that require network access",
]
