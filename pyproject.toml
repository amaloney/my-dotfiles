[project]
name = "my-dotfiles"
version = "2026.10.07"
description = "Personal dotfiles and configuration"
requires-python = ">=3.12,<3.15"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.15"
chromadb = ">=0.3.23,<2"
sentence-transformers = ">=6.1.0,<7"

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.16.10,<0.17"
pytest = ">=8,<10"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
lint = "ruff check ."
format = "ruff format ."
check = { depends-on = ["lint"] }

[tool.pixi.feature.dev.tasks]
test = "pytest"

[tool.pytest.ini_options]
testpaths = [".config/harnesses/skills/chat-provenance/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["third-party", ".kilo", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
