[project]
name = "metadata-observer"
version = "0.1.0"
description = "Package metadata acquisition (PyPI, conda, GitHub)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metadata_observer"]

# pixi
[tool.pixi.workspace]
channels = ["https://repo.anaconda.com/pkgs/main", "conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
requests = ">=2.32,<3"
pytest = ">=8.4,<10"
pytest-cov = ">=6,<8"
ruff = ">=0.12,<0.16"

[tool.pixi.pypi-dependencies]
metadata-observer = { path = ".", editable = true }

[tool.pixi.tasks]
test = "python -m pytest tests/ -v"
lint = "ruff check src/ tests/"

# ruff
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

# pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "network: marks tests that require network access",
]
