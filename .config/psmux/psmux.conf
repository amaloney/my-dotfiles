# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# General
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# shell
set-option -g default-shell pwsh

# mouse
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
setw -g mouse on

set-option -g set-titles on
setw -g mode-keys vi
set -g history-limit 300000
set-option -g repeat-time 0
set-option -g escape-time 10

# psmux-specific options
set -g warm on
set -g paste-detection on
set -g env-shim on
set -g bold-is-bright on

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Windows
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Start window numbering at 1.
set -g base-index 1

# Renumber windows when one is closed
set-option -g renumber-windows on

# Window navigation.
unbind n
unbind p
bind -r C-h previous-window # select previous window
bind -r C-l next-window     # select next window

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Panes
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Start pane numbering at 1.
set -g pane-base-index 1

# Style the inactive/active panes.
set -g window-style 'bg=colour0'
set -g window-active-style 'bg=colour232'

# Pane navigation.
bind -r k select-pane -U  # Move up,
bind -r j select-pane -D  # Move down.
bind -r h select-pane -L  # Move left.
bind -r l select-pane -R  # Move right.
bind > swap-pane -D       # Swap current pane with the next one.
bind < swap-pane -U       # Swap current pane with the previous one.

# Open split panes in the same directory.
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane borders
set -g pane-border-lines single
set -g pane-border-indicators colour

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Gruvbox Theme
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Gruvbox dark colors
set -g status-style 'bg=#3c3836,fg=#ebdbb2'
set -g message-style 'bg=#504945,fg=#ebdbb2'
set -g mode-style 'bg=#fabd2f,fg=#282828'

# Pane borders
set -g pane-border-style 'fg=#665c54'
set -g pane-active-border-style 'fg=#b8bb26'

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-left '#[bg=#b8bb26,fg=#282828,bold] #S #[bg=#3c3836,fg=#b8bb26] '
set -g status-left-length 30
set -g status-right '#[fg=#a89984]%Y-%m-%d #[fg=#ebdbb2]%A %I:%M %p '
set -g status-right-length 50

# Window status
set -g window-status-format '#[fg=#a89984] #I:#W '
set -g window-status-current-format '#[bg=#504945,fg=#fabd2f,bold] #I:#W '

# Clear status bar during rename for cleaner input
bind , set -g status off \; command-prompt -I "#W" "rename-window '%%' ; set -g status on"
