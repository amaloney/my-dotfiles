[project]
name = "PROJECT_NAME"
version = "0.1.0"
description = ""  # TODO: add description
readme = "README.md"
requires-python = ">=3.12"
# license = { text = "MIT" }  # TODO: uncomment and set license
# authors = [{ name = "", email = "" }]  # TODO: add authors
# keywords = []  # TODO: add keywords
# classifiers = []  # TODO: add classifiers

# TODO: uncomment and add runtime dependencies
# dependencies = [
#     "click>=8.0",
#     "rich>=13.0",
# ]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# docs = ["mkdocs", "mkdocs-material"]  # TODO: uncomment if using docs

# TODO: uncomment if project has CLI entry points
# [project.scripts]
# mycommand = "PROJECT_NAME.cli:main"

[project.urls]
# Homepage = "https://github.com/USER/PROJECT_NAME"  # TODO: add URLs
# Documentation = "https://PROJECT_NAME.readthedocs.io"
# Repository = "https://github.com/USER/PROJECT_NAME"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/PROJECT_NAME"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
]
ignore = [
    "ANN101",  # missing self type annotation
    "ANN102",  # missing cls type annotation
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["PROJECT_NAME"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert allowed in tests (bandit: use of assert detected)
    "ANN",   # type annotations not required in tests
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.pyrefly]
python-version = "3.12"
project-includes = [
    "src/**/*.py",
    "tests/**/*.py",
]

[tool.pyrefly.overrides]
"tests/**" = { ignore_errors = ["*"] }
